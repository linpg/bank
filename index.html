<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WK - 一鍵開啟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        /* 一鍵全開按鈕的樣式，設為藍色以示區別 */
        .open-all-btn {
            background-color: #007BFF;
            color: white;
            border: none;
            font-weight: bold;
            padding: 15px 30px;
            display: block;
            margin: 20px auto;
        }
        .open-all-btn:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        function openAllLinks() {
            // 定義所有要開啟的網址
            const urls = [
'https://translate.google.com/?hl=zh-cn&sl=auto&tl=zh-TW&op=translate', // 翻译
                'https://translate.google.com/?hl=zh-cn&sl=auto&tl=th&text=%E0%B8%99%E0%B8%B2%E0%B8%A2%20%E0%B8%98%E0%B8%B5%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%A5%20%E0%B8%AA%E0%B8%B8%E0%B8%94%E0%B8%AA%E0%B8%A7%E0%B8%B2%E0%B8%97%0A2063672095%20%20%20KBANK%0A%0A%E0%B9%82%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%87%E0%B8%B4%E0%B8%99%20QR%20%E0%B9%80%E0%B8%94%E0%B8%B4%E0%B8%A1&op=images
', // 翻译
                'https://www.bitkub.com/en/market/USDT_THB', // 币
                'https://aurums.org/', // 123
                'https://docs.google.com/spreadsheets/d/1Fysvt4qSYvQ7NX4TG2Jb77B21rd3dQNrL74LgITj7h4/edit?gid=1091725154#gid=1091725154', // 仓
                'https://docs.google.com/spreadsheets/d/1RcWcCIDFPZF32Gq76JF1MSVOMqWFw-uWZHX6KHPWgcU/edit?gid=987500975#gid=987500975',   // 表
                'https://docs.google.com/spreadsheets/d/1bKGKqzW2T4BdXzGrMLOhtl-4H3FGRMYp8vkQCDUtLZ4/edit?gid=165404223#gid=165404223', // 车
                'https://docs.google.com/spreadsheets/d/1v3wRJ4ZVKsV_rIfOFc7mhw9QxVlkIR5Avikp02LpdH8/edit?gid=573532707#gid=573532707', // D
               
            ];

            // 遍歷網址並開啟
            urls.forEach(url => {
                window.open(url, '_blank');
            });
        }
    </script>
</head>
<body>
    <h1>選擇要開啟的連接</h1>

    <button class="open-all-btn" onclick="openAllLinks()">一鍵開啟</button>
    
    <hr style="width: 50%; margin: 20px auto;">
     <button onclick="window.open('https://www.bitkub.com/en/market/USDT_THB')">币</button>
 <button onclick="window.open('https://translate.google.com/?hl=zh-cn&sl=auto&tl=th&text=%E0%B8%99%E0%B8%B2%E0%B8%A2%20%E0%B8%98%E0%B8%B5%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%A5%20%E0%B8%AA%E0%B8%B8%E0%B8%94%E0%B8%AA%E0%B8%A7%E0%B8%B2%E0%B8%97%0A2063672095%20%20%20KBANK%0A%0A%E0%B9%82%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%87%E0%B8%B4%E0%B8%99%20QR%20%E0%B9%80%E0%B8%94%E0%B8%B4%E0%B8%A1&op=images
')">翻译</button>
    <button onclick="window.open('https://translate.google.com/?hl=zh-cn&sl=auto&tl=zh-TW&op=translate')">翻译</button>
    <button onclick="window.open('https://aurums.org/')">123</button>
   <button onclick="window.open('https://docs.google.com/spreadsheets/d/1Fysvt4qSYvQ7NX4TG2Jb77B21rd3dQNrL74LgITj7h4/edit?gid=1091725154#gid=1091725154')">仓</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1RcWcCIDFPZF32Gq76JF1MSVOMqWFw-uWZHX6KHPWgcU/edit?gid=987500975#gid=987500975')">表</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1bKGKqzW2T4BdXzGrMLOhtl-4H3FGRMYp8vkQCDUtLZ4/edit?gid=165404223#gid=165404223')">车</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1v3wRJ4ZVKsV_rIfOFc7mhw9QxVlkIR5Avikp02LpdH8/edit?gid=573532707#gid=573532707')">D</button>
    
</body>
</html>
