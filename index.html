<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WK - 一鍵開啟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        /* 一鍵全開按鈕的樣式，設為藍色以示區別 */
        .open-all-btn {
            background-color: #007BFF;
            color: white;
            border: none;
            font-weight: bold;
            padding: 15px 30px;
            display: block;
            margin: 20px auto;
        }
        .open-all-btn:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        function openAllLinks() {
            // 定義所有要開啟的網址
            const urls = [
                'https://accounts.google.com/', // 云端
                'https://docs.google.com/spreadsheets/d/1WfeRXAvyHFazRb0Th3gqZ7_4G5OnDM2yS5JVkT7GBLo/edit?pli=1&gid=2001870745#gid=2001870745', // 罐
                'https://docs.google.com/spreadsheets/d/18OTdSmlS4g4lTd35MQKodDSso3LUw_QS4DjQbyCN5Fs/edit?pli=1&gid=987500975#gid=987500975',   // 表
                'https://docs.google.com/spreadsheets/d/1cCwtQGnj5rYOVCtJo16kKiLyB-t6zZAhN50IrP5ES-4/edit?gid=1696891700#gid=1696891700',   // 10
                'https://docs.google.com/spreadsheets/d/1bKGKqzW2T4BdXzGrMLOhtl-4H3FGRMYp8vkQCDUtLZ4/edit?gid=165404223#gid=165404223', // 车
                'https://docs.google.com/spreadsheets/d/1v3wRJ4ZVKsV_rIfOFc7mhw9QxVlkIR5Avikp02LpdH8/edit?gid=573532707#gid=573532707', // D
                'https://www.google.com/search?q=%E7%BF%BB%E8%AF%91&oq=%E7%BF%BB%E8%AF%91&gs_lcrp=EgZjaHJvbWUyBggAEEUYOdIBBzYyNmowajeoAgCwAgA&sourceid=chrome&source=chrome.ob&ie=UTF-8', // 翻译
            ];

            // 遍歷網址並開啟
            urls.forEach(url => {
                window.open(url, '_blank');
            });
        }
    </script>
</head>
<body>
    <h1>選擇要開啟的連接</h1>

    <button class="open-all-btn" onclick="openAllLinks()">🏦 一鍵開啟</button>
    
    <hr style="width: 50%; margin: 20px auto;">

    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1WfeRXAvyHFazRb0Th3gqZ7_4G5OnDM2yS5JVkT7GBLo/edit?pli=1&gid=2001870745#gid=2001870745')">罐</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/18OTdSmlS4g4lTd35MQKodDSso3LUw_QS4DjQbyCN5Fs/edit?pli=1&gid=987500975#gid=987500975')">表</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1cCwtQGnj5rYOVCtJo16kKiLyB-t6zZAhN50IrP5ES-4/edit?gid=1696891700#gid=1696891700')">10</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1bKGKqzW2T4BdXzGrMLOhtl-4H3FGRMYp8vkQCDUtLZ4/edit?gid=165404223#gid=165404223')">车</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1v3wRJ4ZVKsV_rIfOFc7mhw9QxVlkIR5Avikp02LpdH8/edit?gid=573532707#gid=573532707')">D</button>
        <button onclick="window.open('https://www.google.com/search?q=%E7%BF%BB%E8%AF%91&oq=%E7%BF%BB%E8%AF%91&gs_lcrp=EgZjaHJvbWUyBggAEEUYOdIBBzYyNmowajeoAgCwAgA&sourceid=chrome&source=chrome.ob&ie=UTF-8')">翻译</button>
</body>
</html>
